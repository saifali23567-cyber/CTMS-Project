     <!-- Raw SQL Auth Demo (Full Fields - Plain Password) -->
<div class="container mt-5">
  <div class="card border-danger shadow">
    <div class="card-header bg-danger text-white text-center">
      <h4><i class="bi bi-exclamation-triangle me-2"></i>Raw SQL Auth Demo </h4>
    </div>
    <div class="card-body">
      <div class="row g-4">
        <div class="col-md-6">
          <h5 class="text-danger">Register via Raw SQL</h5>
          <div class="mb-3"><input type="text" id="rawRegName" class="form-control" placeholder="Full Name" required></div>
          <div class="mb-3"><input type="email" id="rawRegEmail" class="form-control" placeholder="Email" required></div>
          <div class="mb-3"><input type="password" id="rawRegPass" class="form-control" placeholder="Password" required></div>
          <div class="mb-3"><input type="text" id="rawRegPhone" class="form-control" placeholder="Phone (e.g., 923001234567)" required></div>
          <div class="mb-3"><input type="text" id="rawRegAddress" class="form-control" placeholder="Address (optional)"></div>
          <div class="mb-3">
            <select id="rawRegRole" class="form-select" required>
              <option value="">-- Select Role --</option>
              <option value="Customer">Customer</option>
              <option value="Courier">Courier</option>
              <option value="Admin">Admin</option>
            </select>
          </div>
          <button class="btn btn-danger w-100" onclick="demoRegisterRaw()">Register (Raw SQL Demo)</button>
          <div id="rawRegResult" class="mt-3"></div>
        </div>

        <div class="col-md-6">
          <h5 class="text-danger">Login via Raw SQL</h5>
          <div class="mb-3"><input type="email" id="rawLoginEmail" class="form-control" placeholder="Email" required></div>
          <div class="mb-3"><input type="password" id="rawLoginPass" class="form-control" placeholder="Password" required></div>
          <button class="btn btn-danger w-100" onclick="demoLoginRaw()">Login (Raw SQL Demo)</button>
          <div id="rawLoginResult" class="mt-3"></div>
        </div>
      </div>
    </div>
  </div>
</div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/overlayscrollbars@2.11.0/browser/overlayscrollbars.browser.es6.min.js" crossorigin="anonymous"></script>

  <!-- Public Tracking Script -->
  <script>
 async function trackPackage() {
  const trackingNumber = document.getElementById('trackingNumberInput').value.trim().toUpperCase();
  const resultDiv = document.getElementById('trackingResult');

  if (!trackingNumber) {
    resultDiv.innerHTML = '<div class="alert alert-warning">Please enter a tracking number</div>';
    return;
  }

  resultDiv.innerHTML = '<div class="text-center py-4"><div class="spinner-border text-primary"></div><p>Searching...</p></div>';

  try {
    const res = await fetch(`/api/Package/track/${trackingNumber}`);

    if (res.ok) {
      const pkg = await res.json();
      resultDiv.innerHTML = `
        <div class="alert alert-success">
          <h5>Package Found!</h5>
          <p><strong>Status:</strong> 
            <span class="badge bg-${pkg.status === 'DELIVERED' ? 'success' : 'warning'}">
              ${pkg.status || 'PENDING'}
            </span>
          </p>
          <p><strong>Delivery Address:</strong><br>${pkg.deliveryAddress || 'Not provided'}</p>
        </div>
      `;
    } else if (res.status === 404) {
      resultDiv.innerHTML = '<div class="alert alert-danger">Package not found</div>';
    } else {
      resultDiv.innerHTML = '<div class="alert alert-danger">Error checking package</div>';
    }
  } catch (err) {
    resultDiv.innerHTML = '<div class="alert alert-danger">Network error</div>';
  }
}
</script>

  <!-- Login Script -->
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      if (!email || !password) {
        alert('Please enter email and password');
        return;
      }

      try {
        const response = await fetch('/api/Auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        if (response.ok) {
  const data = await response.json();
  localStorage.setItem('token', data.token);
  localStorage.setItem('role', data.role);
  localStorage.setItem('userId', data.userId);  // ContactId
  localStorage.setItem('roleId', data.roleId);  // ← ADD THIS LINE
  window.location.href = 'dashboard.html';
} else {
          alert('Login failed: Invalid email or password');
        }
      } catch (err) {
        alert('Network error. Is the API running?');
        console.error(err);
      }
    });
  </script>

async function demoRegisterRaw() {
  const name = document.getElementById('rawRegName').value.trim();
  const email = document.getElementById('rawRegEmail').value.trim();
  const password = document.getElementById('rawRegPass').value;
  const phone = document.getElementById('rawRegPhone').value.trim();
  const address = document.getElementById('rawRegAddress').value.trim();
  const role = document.getElementById('rawRegRole').value;
  const resultDiv = document.getElementById('rawRegResult');

  if (!name || !email || !password || !phone || !role) {
    resultDiv.innerHTML = '<div class="alert alert-warning">Please fill all required fields</div>';
    return;
  }

  resultDiv.innerHTML = '<div class="text-center"><div class="spinner-border text-danger"></div> Registering via Raw SQL...</div>';

  try {
    const res = await fetch('/api/Auth/demo-register-raw', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ 
        name, 
        email, 
        password, 
        phone, 
        address: address || null,
        role 
      })
    });

    const data = await res.json();

    if (res.ok) {
      resultDiv.innerHTML = `
        <div class="alert alert-success">
          <strong>Registered via Raw SQL!</strong><br>
          Email: ${email}<br>
          Role: ${role}<br>
          <small class="text-danger">Password stored</small>
        </div>`;

      // Auto-fill and login
      document.getElementById('rawLoginEmail').value = email;
      document.getElementById('rawLoginPass').value = password;
      setTimeout(demoLoginRaw, 1000);
    } else {
      resultDiv.innerHTML = `<div class="alert alert-danger">Register failed: ${data.message || 'Error'}</div>`;
    }
  } catch (err) {
    resultDiv.innerHTML = '<div class="alert alert-danger">Network error</div>';
  }
}

async function demoLoginRaw() {
  const email = document.getElementById('rawLoginEmail').value.trim();
  const password = document.getElementById('rawLoginPass').value;
  const resultDiv = document.getElementById('rawLoginResult');

  if (!email || !password) {
    resultDiv.innerHTML = '<div class="alert alert-warning">Enter email and password</div>';
    return;
  }

  resultDiv.innerHTML = '<div class="text-center"><div class="spinner-border text-danger"></div></div>';

  try {
    const res = await fetch('/api/Auth/demo-login-raw', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });

    const data = await res.json();

    if (res.ok) {
      // SAVE TOKEN AND ROLE - THIS WAS MISSING!
      localStorage.setItem('token', data.token);
      localStorage.setItem('role', data.role);

      resultDiv.innerHTML = `
        <div class="alert alert-success">
          <strong>Login successful via Raw SQL!</strong><br>
          Role: ${data.role}<br>
          Redirecting to dashboard...
        </div>`;

      // Redirect to dashboard after short delay
      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 1500);
    } else {
      resultDiv.innerHTML = `<div class="alert alert-danger">${data.message || data || 'Login failed'}</div>`;
    }
  } catch (err) {
    resultDiv.innerHTML = '<div class="alert alert-danger">Network error</div>';
  }
}
  </script>
